<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown & Stone — Show Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f7f3ea;
    --panel:#ffffff;
    --panel-2:#fbf6ec;
    --hairline:#e3d9c6;
    --cream:#2b2620;
    --cream-dim:#8a7d6a;
    --gold:#b8863f;
    --gold-bright:#9c6f2e;
    --sold:#c9bda3;
    --danger:#c1544a;
    --good:#5f8a53;
    --radius:14px;
    --serif: 'Fraunces', serif;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(184,134,63,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(184,134,63,0.05), transparent 55%),
      var(--ink);
    color:var(--cream);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:18px;
    padding:16px 24px;
    background:rgba(247,243,234,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
  }
  .wordmark{
    font-family:var(--serif);
    font-weight:600;
    font-size:21px;
    letter-spacing:0.03em;
    color:var(--gold-bright);
    white-space:nowrap;
    display:flex; align-items:baseline; gap:8px;
  }
  .wordmark small{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cream-dim);
    font-weight:500;
  }
  .search-wrap{
    flex:1;
    position:relative;
    max-width:520px;
  }
  .search-wrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:999px;
    padding:11px 18px 11px 40px;
    color:var(--cream);
    font-family:var(--sans);
    font-size:14.5px;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .search-wrap input::placeholder{color:var(--cream-dim);}
  .search-wrap input:focus{border-color:var(--gold); background:var(--panel-2);}

  .jump-wrap{
    position:relative; display:flex; align-items:center; flex-shrink:0;
  }
  .jump-hash{
    position:absolute; left:14px; color:var(--cream-dim); font-family:var(--mono);
    font-size:14px; pointer-events:none;
  }
  .jump-wrap input{
    width:104px;
    background:var(--panel); border:1px solid var(--hairline); border-radius:999px;
    padding:11px 14px 11px 28px; color:var(--cream); font-family:var(--mono);
    font-size:14px; outline:none; transition:border-color .15s ease, background .15s ease;
    -moz-appearance:textfield;
  }
  .jump-wrap input::-webkit-outer-spin-button,
  .jump-wrap input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .jump-wrap input::placeholder{color:var(--cream-dim); font-family:var(--sans);}
  .jump-wrap input:focus{border-color:var(--gold); background:var(--panel-2);}
  .jump-wrap input.jump-error{border-color:var(--danger); animation:jumpShake .3s ease;}
  @keyframes jumpShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  .search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; opacity:0.55; pointer-events:none;
  }
  .topbar-meta{
    display:flex; align-items:center; gap:14px;
    font-family:var(--mono); font-size:11.5px; letter-spacing:0.05em;
    color:var(--cream-dim); white-space:nowrap;
  }
  .pill{
    padding:6px 12px; border-radius:999px; border:1px solid var(--hairline);
    background:var(--panel); cursor:pointer; color:var(--cream-dim);
    font-family:var(--mono); font-size:11px; letter-spacing:0.05em;
    transition:all .15s ease;
  }
  .pill:hover{border-color:var(--gold); color:var(--gold-bright);}
  .pill.active{background:var(--gold); color:#fdf9f0; border-color:var(--gold); font-weight:600;}

  .go-live-btn{
    background:var(--gold); color:#fdf9f0; border:none;
    font-family:var(--mono); font-size:12px; letter-spacing:0.06em; font-weight:600;
    padding:10px 18px; border-radius:999px; cursor:pointer; white-space:nowrap;
    transition:all .15s ease;
    box-shadow:0 6px 16px rgba(184,134,63,0.3);
  }
  .go-live-btn:hover{background:var(--gold-bright); transform:translateY(-1px);}

  .export-btn{
    background:transparent; color:var(--cream-dim); border:1px solid var(--hairline);
    font-family:var(--mono); font-size:12px; letter-spacing:0.04em; font-weight:600;
    padding:9px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;
    transition:all .15s ease;
  }
  .export-btn:hover{border-color:var(--gold); color:var(--gold-bright);}

  .filterbar{
    display:flex; gap:8px; padding:12px 24px; overflow-x:auto;
    border-bottom:1px solid var(--hairline);
    background:rgba(247,243,234,0.5);
  }
  .filterbar::-webkit-scrollbar{height:0;}

  /* ---------- grid ---------- */
  .grid-wrap{ padding:22px 24px 90px; }
  .grid-count{
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em;
    color:var(--cream-dim); text-transform:uppercase; margin-bottom:14px;
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
    max-width:1400px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative;
    display:grid;
    grid-template-columns:20px 52px 230px 1fr auto auto auto;
    align-items:center;
    gap:22px;
    padding:14px 20px 14px 14px;
  }
  .card-num{
    font-family:var(--serif); font-weight:600; font-size:22px;
    color:var(--cream-dim); text-align:center;
    cursor:text; min-width:36px;
  }
  .card-num:hover{color:var(--gold-bright);}
  .card-handle{
    width:20px; display:flex; align-items:center; justify-content:center;
    color:var(--cream-dim); cursor:grab; flex-shrink:0;
  }
  .card-handle svg{width:16px; height:16px;}
  .card.dragging{opacity:0.35;}
  .card.drag-over{box-shadow:inset 0 3px 0 var(--gold);}
  .card.drag-disabled .card-handle{opacity:0.25; cursor:not-allowed;}
  .reorder-hint{
    font-family:var(--mono); font-size:11px; color:var(--cream-dim);
    padding:0 24px 10px; letter-spacing:0.03em;
  }
  .reorder-hint button{
    background:none; border:none; color:var(--gold-bright); font-family:var(--mono);
    font-size:11px; text-decoration:underline; cursor:pointer; padding:0; letter-spacing:0.03em;
  }
  [contenteditable="true"]{
    outline:none; border-radius:4px; padding:1px 3px; margin:-1px -3px;
    transition:background .12s ease;
  }
  [contenteditable="true"]:hover{background:rgba(184,134,63,0.08);}
  [contenteditable="true"]:focus{background:rgba(184,134,63,0.14); box-shadow:0 0 0 1.5px var(--gold);}
  .edit-hint-icon{
    display:inline-block; width:11px; height:11px; opacity:0.35; margin-left:5px;
    vertical-align:middle;
  }
  .section-header{
    display:flex; align-items:baseline; gap:12px;
    margin:28px 0 12px; padding-left:4px;
  }
  .section-header:first-child{margin-top:0;}
  .section-header h2{
    font-family:var(--serif); font-weight:600; font-size:22px; color:var(--cream); margin:0;
  }
  .section-header .count{
    font-family:var(--mono); font-size:11.5px; color:var(--cream-dim); letter-spacing:0.05em;
  }
  .section-header .line{flex:1; height:1px; background:var(--hairline);}
  .subsection-header{
    display:flex; align-items:baseline; gap:10px;
    margin:16px 0 8px; padding-left:4px;
  }
  .subsection-header h3{
    font-family:var(--mono); font-weight:600; font-size:12px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--gold-bright); margin:0;
  }
  .subsection-header .subcount{
    font-family:var(--mono); font-size:10.5px; color:var(--cream-dim); letter-spacing:0.04em;
  }
  .subsection-header .subline{flex:1; height:1px; background:var(--hairline); opacity:0.6;}
  .card:hover{
    transform:translateX(4px);
    border-color:var(--gold);
    box-shadow:0 10px 26px rgba(43,38,32,0.12);
  }
  .card.sold{opacity:0.4;}
  .card-img{
    width:210px; height:210px; border-radius:12px; background:#eee4d3;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex-shrink:0;
  }
  .card-img img{width:100%; height:100%; object-fit:cover;}
  .card-body{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .card-sku{
    font-family:var(--mono); font-size:11.5px; color:var(--gold);
    letter-spacing:0.06em;
  }
  .card-variant{
    font-family:var(--mono); font-size:11px; color:var(--cream-dim);
    letter-spacing:0.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-specs{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .spec-tag{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:0.03em;
    padding:3px 9px; border-radius:6px;
    background:var(--panel-2); border:1px solid var(--hairline); color:var(--cream);
  }
  .spec-tag.material{color:var(--gold-bright); border-color:rgba(184,134,63,0.35);}
  .card-name{
    font-family:var(--serif); font-size:21px; line-height:1.22;
    color:var(--cream); font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-price{
    font-family:var(--mono); font-size:22px; color:var(--gold-bright); font-weight:600;
    text-align:right; white-space:nowrap;
  }
  .card-qty{
    font-family:var(--mono); font-size:12px; color:var(--cream-dim);
    text-align:right; white-space:nowrap; min-width:88px;
  }
  .card-qty.low{color:var(--danger);}
  .sold-badge{
    position:absolute; top:10px; right:10px;
    background:var(--sold); color:#3d3323;
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em;
    padding:4px 8px; border-radius:5px; text-transform:uppercase;
  }
  .hero-badge{
    position:absolute; top:10px; right:10px;
    background:var(--gold); color:#fdf9f0;
    font-family:var(--mono); font-weight:700; font-size:9.5px; letter-spacing:0.1em;
    padding:4px 9px; border-radius:5px; text-transform:uppercase;
    box-shadow:0 4px 12px rgba(184,134,63,0.35);
  }
  .focus-hero-badge{
    display:inline-block; background:var(--gold); color:#fdf9f0;
    font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:0.08em;
    padding:5px 12px; border-radius:999px; text-transform:uppercase;
    margin-bottom:4px;
  }
  .card-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .card-delete{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--hairline); background:transparent;
    color:var(--cream-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease; flex-shrink:0;
  }
  .card-delete:hover{border-color:var(--danger); color:var(--danger); background:rgba(193,84,74,0.08);}
  .card-delete svg{width:16px; height:16px;}
  .card-duplicate{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--hairline); background:transparent;
    color:var(--cream-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease; flex-shrink:0;
  }
  .card-duplicate:hover{border-color:var(--gold); color:var(--gold-bright); background:rgba(184,134,63,0.08);}
  .card-duplicate svg{width:16px; height:16px;}

  .undo-toast{
    position:fixed; bottom:26px; left:50%; transform:translate(-50%, 20px);
    background:var(--cream); color:var(--ink);
    font-family:var(--sans); font-size:14px;
    padding:12px 18px; border-radius:10px;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 14px 34px rgba(43,38,32,0.25);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:200;
  }
  .undo-toast.show{opacity:1; transform:translate(-50%, 0); pointer-events:auto;}
  .undo-toast button{
    background:none; border:none; color:var(--gold-bright); font-family:var(--mono);
    font-size:13px; font-weight:600; letter-spacing:0.04em; cursor:pointer; text-transform:uppercase;
  }
  @media (max-width:760px){
    .card{grid-template-columns:0px 32px 90px 1fr; grid-template-rows:auto auto; row-gap:6px; padding:10px 14px 10px 10px;}
    .card-handle{display:none;}
    .card-img{width:82px; height:82px;}
    .card-num{font-size:16px;}
    .card-price, .card-qty{text-align:left; grid-column:4;}
    .card-name{font-size:17px;}
  }

  .empty{
    text-align:center; padding:100px 20px; color:var(--cream-dim);
    font-family:var(--serif); font-size:18px; font-style:italic;
  }

  /* ---------- focus mode (the big screen reader) ---------- */
  .focus-overlay{
    position:fixed; inset:0; z-index:100;
    background:var(--ink);
    display:none;
    flex-direction:column;
  }
  .focus-overlay.open{display:flex;}
  .focus-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px; border-bottom:1px solid var(--hairline);
  }
  .focus-position{
    font-family:var(--mono); font-size:12px; letter-spacing:0.1em; color:var(--cream-dim);
  }
  .focus-close{
    background:none; border:1px solid var(--hairline); color:var(--cream-dim);
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    transition:all .15s ease;
  }
  .focus-close:hover{border-color:var(--gold); color:var(--gold-bright);}

  .focus-body{
    flex:1; display:flex; align-items:center; justify-content:center; gap:0;
    padding:20px 32px 32px; overflow:hidden;
  }
  .focus-stage{
    display:grid; grid-template-columns:minmax(320px,52%) 1fr; gap:56px;
    max-width:1500px; width:100%; height:100%; align-items:center;
  }
  .focus-info{display:flex; flex-direction:column; gap:18px; min-width:0;}
  .focus-sku{
    font-family:var(--mono); font-size:15px; color:var(--gold); letter-spacing:0.08em;
  }
  .focus-variant{
    font-family:var(--mono); font-size:13px; color:var(--cream-dim); letter-spacing:0.03em;
  }
  .focus-specs{
    display:flex; gap:12px; flex-wrap:wrap;
  }
  .focus-spec-tag{
    font-family:var(--mono); font-weight:700; letter-spacing:0.03em;
    font-size:clamp(16px,1.6vw,20px);
    padding:8px 16px; border-radius:9px;
    background:var(--panel-2); border:1.5px solid var(--hairline); color:var(--cream);
  }
  .focus-spec-tag.material{color:var(--gold-bright); border-color:var(--gold); background:rgba(184,134,63,0.08);}
  .focus-name{
    font-family:var(--serif); font-weight:500; font-size:clamp(30px,4vw,54px);
    line-height:1.08; color:var(--cream);
  }
  .focus-price-row{display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;}
  .focus-price{
    font-family:var(--mono); font-weight:600; color:var(--gold-bright);
    font-size:clamp(30px,3.4vw,46px);
  }
  .focus-price-was{
    font-family:var(--mono); font-size:18px; color:var(--cream-dim); text-decoration:line-through;
  }
  .focus-qty-row{
    display:flex; align-items:center; gap:14px; margin-top:6px;
  }
  .qty-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--hairline);
    background:var(--panel); color:var(--cream); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .qty-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .qty-display{
    font-family:var(--mono); font-size:20px; min-width:110px; text-align:center;
  }
  .qty-display b{font-size:26px; color:var(--gold-bright);}
  .mark-sold-btn{
    margin-top:8px; align-self:flex-start;
    background:transparent; border:1px solid var(--hairline); color:var(--cream-dim);
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    padding:10px 20px; border-radius:999px; cursor:pointer;
    transition:all .15s ease;
  }
  .mark-sold-btn:hover{border-color:var(--danger); color:var(--danger);}
  .mark-sold-btn.is-sold{border-color:var(--good); color:var(--good);}

  .next-piece-btn{
    margin-top:14px; align-self:flex-start;
    background:var(--gold); color:#fdf9f0; border:none;
    font-family:var(--mono); font-size:14px; letter-spacing:0.05em; font-weight:600;
    padding:14px 28px; border-radius:999px; cursor:pointer;
    transition:all .15s ease;
    box-shadow:0 8px 20px rgba(184,134,63,0.32);
  }
  .next-piece-btn:hover{background:var(--gold-bright); transform:translateY(-1px);}

  .focus-notes-wrap{
    margin-top:6px; display:flex; flex-direction:column; gap:6px; max-width:520px;
  }
  .focus-notes-wrap label{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--cream-dim);
  }
  .focus-notes-wrap textarea{
    font-family:var(--sans); font-size:14px; color:var(--cream);
    background:var(--panel-2); border:1px solid var(--hairline); border-radius:9px;
    padding:10px 12px; resize:vertical; outline:none;
    transition:border-color .15s ease;
  }
  .focus-notes-wrap textarea:focus{border-color:var(--gold);}

  .focus-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,0.9); border:1px solid var(--hairline); color:var(--cream);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:24px; transition:all .15s ease; z-index:5;
    box-shadow:0 8px 20px rgba(43,38,32,0.12);
  }
  .focus-nav:hover{border-color:var(--gold); color:var(--gold-bright); transform:translateY(-50%) scale(1.06);}
  .focus-nav.prev{left:20px;}
  .focus-nav.next{
    right:20px;
    width:78px; height:78px; font-size:30px;
    background:var(--gold); color:#fdf9f0; border:none;
    box-shadow:0 10px 24px rgba(184,134,63,0.4);
  }
  .focus-nav.next:hover{background:var(--gold-bright); color:#fdf9f0; transform:translateY(-50%) scale(1.08);}

  .bounce-hint{
    font-family:var(--mono); font-size:11px; letter-spacing:0.06em; color:var(--cream-dim);
    text-align:center; padding:0 0 14px;
  }

  .focus-img{
    width:100%; aspect-ratio:1/1; border-radius:18px; overflow:hidden;
    background:#eee4d3; border:1px solid var(--hairline);
    box-shadow:0 30px 80px rgba(43,38,32,0.18);
    cursor:pointer;
    transition:transform .1s ease;
  }
  .focus-img:active{transform:scale(0.98);}
  .focus-img img{width:100%; height:100%; object-fit:cover; pointer-events:none;}

  @media (max-width:900px){
    .focus-stage{grid-template-columns:1fr; gap:22px; overflow-y:auto;}
    .focus-body{padding:14px 18px 22px;}
    .focus-nav{display:none;}
    .topbar{flex-wrap:wrap;}
  }
  .app-hidden{display:none !important;}

  .lock-screen{
    position:fixed; inset:0; z-index:500;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(184,134,63,0.09), transparent 60%),
      var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .lock-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:18px;
    padding:40px 36px; width:100%; max-width:340px;
    box-shadow:0 30px 80px rgba(43,38,32,0.18);
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .lock-wordmark{
    font-family:var(--serif); font-weight:600; font-size:24px; letter-spacing:0.03em;
    color:var(--gold-bright);
  }
  .lock-sub{
    font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--cream-dim); margin-bottom:22px;
  }
  .lock-card input{
    width:100%; background:var(--panel-2); border:1px solid var(--hairline); border-radius:10px;
    padding:13px 16px; font-family:var(--mono); font-size:15px; color:var(--cream);
    outline:none; text-align:center; letter-spacing:0.08em;
    transition:border-color .15s ease;
  }
  .lock-card input:focus{border-color:var(--gold);}
  .lock-card button{
    width:100%; margin-top:12px;
    background:var(--gold); color:#fdf9f0; border:none;
    font-family:var(--mono); font-weight:600; font-size:13px; letter-spacing:0.06em; text-transform:uppercase;
    padding:13px; border-radius:10px; cursor:pointer;
    transition:all .15s ease;
  }
  .lock-card button:hover{background:var(--gold-bright);}
  .lock-error{
    margin-top:14px; font-family:var(--mono); font-size:12px; color:var(--danger); text-align:center;
  }
</style>
</head>

// Works both inside Claude (uses window.storage) and as a standalone hosted
// page (falls back to the browser's own localStorage).
const storageAdapter = {
  async get(key){
    if(window.storage && window.storage.get){
      try{ return await window.storage.get(key); }catch(e){}
    }
    try{
      const v = localStorage.getItem(key);
      return v !== null ? { value: v } : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage && window.storage.set){
      try{ return await window.storage.set(key, value); }catch(e){}
    }
    try{ localStorage.setItem(key, value); return { value }; }catch(e){ return null; }
  }
};

const STORAGE_KEY = 'crown-stone-show-state-v2';
let state = { overlay: {}, order: null, duplicates: {} };
let items = [];
let filtered = [];
let currentFilter = 'all';
let currentCategory = 'all';
let currentQuery = '';
let focusIndex = 0;

async function loadState(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.overlay){
        state = { overlay: parsed.overlay || {}, order: parsed.order || null, duplicates: parsed.duplicates || {} };
      } else if(parsed){
        // legacy flat map format
        state = { overlay: parsed, order: null, duplicates: {} };
      }
    }
  }catch(e){ state = { overlay: {}, order: null, duplicates: {} }; }
}
async function saveState(){
  try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function initItems(){
  const duplicateList = Object.values(state.duplicates || {});
  const sourceList = RAW_ITEMS.concat(duplicateList);
  items = sourceList
    .filter(it => !((state.overlay[it.id] || {}).deleted))
    .map(it => {
      const o = state.overlay[it.id] || {};
      return {
        ...it,
        qty: (o.qty !== undefined) ? o.qty : it.qty,
        sold: !!o.sold,
        name: o.name !== undefined ? o.name : it.name,
        price: o.price !== undefined ? o.price : it.price,
        material: o.material !== undefined ? o.material : it.material,
        length: o.length !== undefined ? o.length : it.length,
        width: o.width !== undefined ? o.width : it.width,
        note: o.note || ''
      };
    });
  applyCustomOrder();
}

function applyCustomOrder(){
  if(state.order && state.order.length){
    const orderIndex = new Map(state.order.map((id,i) => [id,i]));
    items.sort((a,b) => {
      const ai = orderIndex.has(a.id) ? orderIndex.get(a.id) : Infinity;
      const bi = orderIndex.has(b.id) ? orderIndex.get(b.id) : Infinity;
      return ai - bi;
    });
  }
  items.forEach((it,i) => it.num = i + 1);
}

let lastDeleted = null;
let undoTimer = null;

async function duplicateItem(id){
  const it = items.find(x => x.id === id);
  if(!it) return;
  const newId = 'dup-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const newBase = {
    id: newId,
    sku: it.sku + '-COPY',
    variant: it.variant,
    name: it.name,
    qty: it.qty,
    price: it.price,
    priceDiscount: it.priceDiscount,
    image: it.image,
    material: it.material,
    length: it.length,
    width: it.width,
    category: it.category,
    style: it.style,
    isHero: false
  };
  state.duplicates = state.duplicates || {};
  state.duplicates[newId] = newBase;

  const idx = items.findIndex(x => x.id === id);
  const newItem = { ...newBase, sold: false, note: '' };
  items.splice(idx + 1, 0, newItem);
  items.forEach((it,i) => it.num = i + 1);
  state.order = items.map(it => it.id);
  await saveState();
  renderGrid();
}

async function deleteItem(id){
  const it = items.find(x => x.id === id);
  if(!it) return;
  lastDeleted = it;
  state.overlay[id] = { ...(state.overlay[id]||{}), deleted: true };
  await saveState();
  items = items.filter(x => x.id !== id);
  items.forEach((it,i) => it.num = i + 1);
  renderGrid();
  showUndoToast(it.name);
}

function showUndoToast(name){
  const toast = document.getElementById('undoToast');
  document.getElementById('undoText').textContent = `Removed "${name.length > 40 ? name.slice(0,40)+'…' : name}"`;
  toast.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => toast.classList.remove('show'), 6000);
}

async function undoDelete(){
  if(!lastDeleted) return;
  const id = lastDeleted.id;
  state.overlay[id] = { ...(state.overlay[id]||{}), deleted: false };
  await saveState();
  items.push(lastDeleted);
  items.sort((a,b) => RAW_ITEMS.findIndex(r=>r.id===a.id) - RAW_ITEMS.findIndex(r=>r.id===b.id));
  applyCustomOrder();
  lastDeleted = null;
  document.getElementById('undoToast').classList.remove('show');
  renderGrid();
}

function applyFilters(){
  const q = currentQuery.trim().toLowerCase();
  filtered = items.filter(it => {
    if(q && !(it.name.toLowerCase().includes(q) || it.sku.toLowerCase().includes(q) || it.variant.toLowerCase().includes(q))) return false;
    if(currentFilter === 'available' && (it.sold || it.qty <= 0)) return false;
    if(currentFilter === 'sold' && !(it.sold || it.qty <= 0)) return false;
    if(currentFilter === 'low' && !(it.qty > 0 && it.qty <= 5 && !it.sold)) return false;
    if(currentCategory !== 'all' && it.category !== currentCategory) return false;
    return true;
  });
}

function renderCategoryPills(){
  const bar = document.getElementById('categoryFilterBar');
  const cats = [...new Set(items.map(it => it.category))];
  const order = ['Necklaces','Bracelets','Rings','Earrings','Packaging','Other'];
  cats.sort((a,b) => order.indexOf(a) - order.indexOf(b));
  bar.innerHTML = `<div class="pill ${currentCategory==='all'?'active':''}" data-category="all">All Types</div>` +
    cats.map(c => `<div class="pill ${currentCategory===c?'active':''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('');
  bar.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      bar.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      currentCategory = pill.getAttribute('data-category');
      renderGrid();
    });
  });
}

function renderGrid(){
  applyFilters();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const hint = document.getElementById('reorderHint');
  document.getElementById('gridCount').textContent = `${filtered.length} piece${filtered.length===1?'':'s'} showing`;
  document.getElementById('metaCount').textContent = `${items.length} items total`;

  const dragReady = currentFilter === 'all' && currentQuery.trim() === '';
  if(!dragReady){
    hint.style.display = 'block';
    hint.textContent = "Clear search & switch to \"All\" to drag and reorder pieces.";
  } else if(state.order && state.order.length){
    hint.style.display = 'block';
    hint.innerHTML = '';
    hint.append(document.createTextNode('Custom order active — drag pieces to rearrange. '));
    const resetBtn = document.createElement('button');
    resetBtn.textContent = 'Reset to auto-sort';
    resetBtn.addEventListener('click', resetOrder);
    hint.appendChild(resetBtn);
  } else {
    hint.style.display = 'block';
    hint.textContent = 'Drag the ⋮⋮ handle to arrange pieces in your own order.';
  }

  if(filtered.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const useGroups = false; // catalog order is now a curated auction sequence, not category blocks

  grid.innerHTML = filtered.map((it, i) => {
    const isSold = it.sold || it.qty <= 0;
    const qtyClass = (!isSold && it.qty <= 5) ? 'low' : '';
    let header = '', subHeader = '';
    if(useGroups){
      const showHeader = i === 0 || filtered[i-1].category !== it.category;
      const showSubHeader = showHeader || filtered[i-1].style !== it.style;
      header = showHeader ? `
        <div class="section-header">
          <h2>${escapeHtml(it.category)}</h2>
          <div class="line"></div>
          <div class="count">${filtered.filter(x=>x.category===it.category).length} pieces</div>
        </div>` : '';
      subHeader = showSubHeader ? `
        <div class="subsection-header">
          <h3>${escapeHtml(it.style)}</h3>
          <div class="subline"></div>
          <div class="subcount">${filtered.filter(x=>x.category===it.category && x.style===it.style).length}</div>
        </div>` : '';
    }
    return `
      ${header}
      ${subHeader}
      <div class="card ${isSold ? 'sold' : ''} ${dragReady ? '' : 'drag-disabled'}" data-id="${it.id}" ${dragReady ? 'draggable="true"' : ''}>
        ${isSold ? '<div class="sold-badge">Sold out</div>' : (it.isHero ? '<div class="hero-badge">★ Hero</div>' : '')}
        <div class="card-handle" title="Drag to reorder">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>
        </div>
        <div class="card-num" contenteditable="true" spellcheck="false" inputmode="numeric" data-id="${it.id}" data-field="num" title="Click to move this piece to a new slot number">${String(it.num).padStart(2,'0')}</div>
        <div class="card-img"><img src="${it.image}" alt="" loading="lazy"></div>
        <div class="card-body">
          <div class="card-sku">${it.sku}</div>
          <div class="card-name" contenteditable="true" spellcheck="false" data-id="${it.id}" data-field="name">${escapeHtml(it.name)}</div>
          <div class="card-specs">
            <span class="spec-tag" contenteditable="true" spellcheck="false" data-id="${it.id}" data-field="length">${escapeHtml(it.length || 'Add length')}</span>
            <span class="spec-tag" contenteditable="true" spellcheck="false" data-id="${it.id}" data-field="width">${escapeHtml(it.width || 'Add width')}</span>
            <span class="spec-tag material" contenteditable="true" spellcheck="false" data-id="${it.id}" data-field="material">${escapeHtml(it.material || 'Add material')}</span>
          </div>
        </div>
        <div class="card-qty ${qtyClass}"><span contenteditable="true" spellcheck="false" inputmode="numeric" data-id="${it.id}" data-field="qty">${it.qty}</span> on hand</div>
        <div class="card-price">$<span contenteditable="true" spellcheck="false" data-id="${it.id}" data-field="price">${escapeHtml(it.price)}</span></div>
        <div class="card-actions">
          <button class="card-duplicate" data-id="${it.id}" title="Duplicate item" aria-label="Duplicate item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="12" height="12" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <button class="card-delete" data-id="${it.id}" title="Delete item" aria-label="Delete item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path><path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          </button>
        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.closest('[contenteditable]') || e.target.closest('.card-delete') || e.target.closest('.card-duplicate')) return;
      const id = card.getAttribute('data-id');
      const idx = filtered.findIndex(it => it.id === id);
      openFocus(idx);
    });
  });

  grid.querySelectorAll('[contenteditable]').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); el.blur(); }
    });
    el.addEventListener('blur', () => commitEdit(el));
  });

  grid.querySelectorAll('.card-delete').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      deleteItem(id);
    });
  });

  grid.querySelectorAll('.card-duplicate').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      duplicateItem(id);
    });
  });

  wireDragEvents(grid);
}

let draggedId = null;

function wireDragEvents(grid){
  grid.querySelectorAll('.card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      draggedId = card.getAttribute('data-id');
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      grid.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
      draggedId = null;
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      if(!draggedId || card.getAttribute('data-id') === draggedId) return;
      grid.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
      card.classList.add('drag-over');
    });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const targetId = card.getAttribute('data-id');
      if(!draggedId || targetId === draggedId) return;
      reorderItems(draggedId, targetId);
    });
  });
}

async function reorderItems(fromId, toId){
  const fromIdx = items.findIndex(it => it.id === fromId);
  const toIdx = items.findIndex(it => it.id === toId);
  if(fromIdx < 0 || toIdx < 0) return;
  const [moved] = items.splice(fromIdx, 1);
  items.splice(toIdx, 0, moved);
  items.forEach((it, i) => it.num = i + 1);
  state.order = items.map(it => it.id);
  await saveState();
  renderGrid();
}

async function resetOrder(){
  state.order = null;
  await saveState();
  initItems();
  renderGrid();
}

async function commitEdit(el){
  const id = el.getAttribute('data-id');
  const field = el.getAttribute('data-field');
  let value = el.textContent.trim();
  const it = items.find(x => x.id === id);
  if(!it) return;

  if(field === 'num'){
    const target = parseInt(value.replace(/[^0-9]/g, ''), 10);
    el.textContent = String(it.num).padStart(2,'0'); // restore display; re-render will refresh
    if(!isNaN(target) && target >= 1 && target !== it.num){
      await moveItemToPosition(id, target);
    }
    return;
  }

  if(field === 'material' && value === 'Add material') value = '';
  if(field === 'length' && value === 'Add length') value = '';
  if(field === 'width' && value === 'Add width') value = '';
  if(field === 'price'){
    const num = parseFloat(value.replace(/[^0-9.]/g, ''));
    value = isNaN(num) ? it.price : num.toFixed(2);
    el.textContent = value;
  }
  if(field === 'qty'){
    const num = parseInt(value.replace(/[^0-9]/g, ''), 10);
    value = isNaN(num) ? it.qty : Math.max(0, num);
    el.textContent = value;
  }
  if(field === 'name' && value === '') value = it.name; // don't allow blank names

  if(it[field] === value) return;
  it[field] = value;
  state.overlay[id] = { ...(state.overlay[id]||{}), [field]: value };
  await saveState();
  if(field === 'material' && value === ''){
    el.textContent = 'Add material';
  }
  if(field === 'length' && value === ''){
    el.textContent = 'Add length';
  }
  if(field === 'width' && value === ''){
    el.textContent = 'Add width';
  }
  if(field === 'qty'){
    renderGrid(); // refresh low-stock styling / filter membership
  }
}

async function moveItemToPosition(id, targetNum){
  const fromIdx = items.findIndex(it => it.id === id);
  if(fromIdx < 0) return;
  const toIdx = Math.max(1, Math.min(targetNum, items.length)) - 1;
  const [moved] = items.splice(fromIdx, 1);
  items.splice(toIdx, 0, moved);
  items.forEach((it, i) => it.num = i + 1);
  state.order = items.map(it => it.id);
  await saveState();
  renderGrid();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openFocus(idx){
  focusIndex = idx;
  renderFocus();
  document.getElementById('focusOverlay').classList.add('open');
}
function closeFocus(){
  document.getElementById('focusOverlay').classList.remove('open');
}
function renderFocus(){
  const it = filtered[focusIndex];
  if(!it) return;
  document.getElementById('focusPosition').textContent = `${focusIndex+1} / ${filtered.length}`;
  document.getElementById('focusImg').src = it.image;
  document.getElementById('focusHeroBadge').style.display = it.isHero ? 'inline-block' : 'none';
  document.getElementById('focusSku').textContent = `No. ${String(it.num).padStart(2,'0')} · ${it.sku}`;
  document.getElementById('focusName').textContent = it.name;
  const specParts = [];
  if(it.length) specParts.push(`<span class="focus-spec-tag">${escapeHtml(it.length)}</span>`);
  if(it.width) specParts.push(`<span class="focus-spec-tag">${escapeHtml(it.width)}</span>`);
  if(it.material) specParts.push(`<span class="focus-spec-tag material">${escapeHtml(it.material)}</span>`);
  document.getElementById('focusSpecs').innerHTML = specParts.join('');
  document.getElementById('focusPrice').textContent = '$' + it.price;
  document.getElementById('qtyValue').textContent = it.qty;
  const btn = document.getElementById('markSoldBtn');
  const isSold = it.sold || it.qty <= 0;
  btn.textContent = isSold ? 'Sold out — click to restore' : 'Mark as sold out';
  btn.classList.toggle('is-sold', isSold);
  document.getElementById('focusNotes').value = it.note || '';
}

async function updateQty(delta){
  const it = filtered[focusIndex];
  if(!it) return;
  it.qty = Math.max(0, it.qty + delta);
  const srcItem = items.find(x => x.id === it.id);
  srcItem.qty = it.qty;
  state.overlay[it.id] = { ...(state.overlay[it.id]||{}), qty: it.qty };
  await saveState();
  renderFocus();
  renderGrid();
}

async function toggleSold(){
  const it = filtered[focusIndex];
  if(!it) return;
  it.sold = !it.sold;
  const srcItem = items.find(x => x.id === it.id);
  srcItem.sold = it.sold;
  state.overlay[it.id] = { ...(state.overlay[it.id]||{}), sold: it.sold };
  await saveState();
  renderFocus();
  renderGrid();
}

function navFocus(delta){
  if(filtered.length === 0) return;
  focusIndex = (focusIndex + delta + filtered.length) % filtered.length;
  renderFocus();
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentQuery = e.target.value;
  renderGrid();
});

const jumpInput = document.getElementById('jumpInput');
jumpInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); jumpToLot(); }
});
jumpInput.addEventListener('blur', () => { if(jumpInput.value) jumpToLot(); });

function jumpToLot(){
  const raw = jumpInput.value.trim();
  jumpInput.classList.remove('jump-error');
  if(!raw) return;
  const n = parseInt(raw, 10);
  const found = items.find(it => it.num === n);
  if(!found){
    jumpInput.classList.add('jump-error');
    setTimeout(() => jumpInput.classList.remove('jump-error'), 350);
    return;
  }
  filtered = items.slice();
  focusIndex = filtered.findIndex(it => it.id === found.id);
  openFocus(focusIndex);
  jumpInput.value = '';
  jumpInput.blur();
}

document.getElementById('filterBar').addEventListener('click', (e) => {
  const pill = e.target.closest('.pill');
  if(!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  currentFilter = pill.getAttribute('data-filter');
  renderGrid();
});

document.getElementById('focusClose').addEventListener('click', closeFocus);
document.getElementById('navPrev').addEventListener('click', () => navFocus(-1));
document.getElementById('navNext').addEventListener('click', () => navFocus(1));
document.getElementById('nextPieceBtn').addEventListener('click', () => navFocus(1));
document.getElementById('focusImg').parentElement.addEventListener('click', () => navFocus(1));
document.querySelector('.bounce-hint').addEventListener('click', () => navFocus(1));
document.querySelector('.bounce-hint').style.cursor = 'pointer';
document.getElementById('qtyMinus').addEventListener('click', (e) => { e.stopPropagation(); updateQty(-1); });
document.getElementById('qtyPlus').addEventListener('click', (e) => { e.stopPropagation(); updateQty(1); });
document.getElementById('markSoldBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleSold(); });
document.getElementById('focusNotes').addEventListener('click', (e) => e.stopPropagation());
document.getElementById('focusNotes').addEventListener('blur', saveNote);

async function saveNote(){
  const it = filtered[focusIndex];
  if(!it) return;
  const value = document.getElementById('focusNotes').value;
  if(it.note === value) return;
  it.note = value;
  const srcItem = items.find(x => x.id === it.id);
  if(srcItem) srcItem.note = value;
  state.overlay[it.id] = { ...(state.overlay[it.id]||{}), note: value };
  await saveState();
}

document.getElementById('goLiveBtn').addEventListener('click', () => {
  applyFilters();
  if(filtered.length === 0) return;
  openFocus(0);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  // Export the current live list (post-deletions, post-edits, post-reorder)
  // WITHOUT the embedded photos, so the file stays small and easy to send back.
  const exportData = items.map(it => ({
    num: it.num,
    id: it.id,
    sku: it.sku,
    name: it.name,
    variant: it.variant,
    material: it.material,
    length: it.length,
    width: it.width,
    price: it.price,
    priceDiscount: it.priceDiscount,
    qty: it.qty,
    sold: it.sold,
    category: it.category,
    style: it.style,
    isHero: it.isHero,
    note: it.note
  }));
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'crown-and-stone-current-list.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('undoBtn').addEventListener('click', undoDelete);

document.addEventListener('keydown', (e) => {
  const overlay = document.getElementById('focusOverlay');
  if(!overlay.classList.contains('open')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'textarea' || tag === 'input' || e.target.isContentEditable) return;
  if(e.key === 'ArrowRight') navFocus(1);
  if(e.key === 'ArrowLeft') navFocus(-1);
  if(e.key === 'Escape') closeFocus();
  if(e.key === ' '){ e.preventDefault(); navFocus(1); }
  if(e.key === '+' || e.key === '=') updateQty(1);
  if(e.key === '-' || e.key === '_') updateQty(-1);
});

const APP_PASSWORD = '123456';
const UNLOCK_KEY = 'crown-stone-unlock-v1';

async function unlockApp(){
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appRoot').classList.remove('app-hidden');
  await loadState();
  initItems();
  renderCategoryPills();
  renderGrid();
}

function wireLockScreen(){
  const input = document.getElementById('lockInput');
  const btn = document.getElementById('lockSubmit');
  const err = document.getElementById('lockError');
  const attempt = async () => {
    if(input.value === APP_PASSWORD){
      try{ await storageAdapter.set(UNLOCK_KEY, 'true'); }catch(e){}
      err.style.display = 'none';
      await unlockApp();
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); attempt(); } });
}

(async function boot(){
  wireLockScreen();
  let alreadyUnlocked = false;
  try{
    const res = await storageAdapter.get(UNLOCK_KEY);
    alreadyUnlocked = !!(res && res.value === 'true');
  }catch(e){}

  if(alreadyUnlocked){
    await unlockApp();
  } else {
    document.getElementById('lockInput').focus();
  }
})();
</script>
